spring.application.name=plantapp

# --- Serveur ---
server.port=8081

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5433/plantapp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=update : acceptable uniquement en contexte de demo academique, jamais en production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# --- Seed SQL (data.sql execute apres la creation des tables par Hibernate) ---
spring.sql.init.mode=always

# --- JWT ---
# Cle secrete de demo (base64, 256 bits). A regenerer si le projet devient reel.
jwt.secret=NDJmNzk5YjEyM2E5NGMyOGI3ZDYwZTFmOGE1YzNkMmU3ZjFhOGI0YzZkOWUwZjJhM2I1YzdkOGU5ZjBhMWIyYzNkNGU1ZjZhN2I4YzlkMGUxZjJhM2I0
jwt.expiration-ms=86400000

# --- CORS (ouvert en dev pour permettre les appels depuis le telephone) ---
app.cors.allowed-origins=*

# --- Logs ---
logging.level.org.springframework.security=INFO